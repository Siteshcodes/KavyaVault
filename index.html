<!DOCTYPE html>
<html lang="hi" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="application-name" content="काव्यकलश" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Synchronous early theme restoration to prevent flash of default theme -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('kavyavault:theme');
          var valid = ['bhojpatra', 'syahi', 'khaddar', 'velvet-night'];
          if (t && valid.indexOf(t) !== -1) {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'bhojpatra');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary SEO Meta Tags -->
    <title>काव्यकलश | Kavyakalash — साहित्यिक धरोहर व पुस्तकालय</title>
    <meta name="title" content="काव्यकलश | Kavyakalash — साहित्यिक धरोहर व पुस्तकालय" />
    <meta name="description" content="काव्यकलश एक शांत, ध्यानमग्न और सुरुचिपूर्ण डिजिटल काव्य पुस्तकालय है। अपनी कविताओं, ग़ज़लों और छंदों का एकांत पठन और संपादन करें।" />
    <meta name="keywords" content="Hindi Poetry, काव्य, कविता, ग़ज़ल, दोहा, छंद, साहित्य, KavyaVault, Devanagari, Literary Archive" />
    <meta name="author" content="Kavyakalash" />
    
    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="hi_IN" />
    <meta property="og:title" content="काव्यकलश | Kavyakalash — साहित्यिक धरोहर व पुस्तकालय" />
    <meta property="og:description" content="एक शांत, एकांत और सुरुचिपूर्ण हिंदी काव्य पुस्तकालय। सुंदर देवनागरी मुद्रणकला और एकाग्र पठन।" />
    <meta property="og:site_name" content="काव्यकलश (Kavyakalash)" />
    <meta property="og:image" content="https://kavyavault-1a3ce.web.app/icon-512.png" />
    <meta property="og:image:alt" content="काव्यकलश का पुस्तक और कलश चिह्न" />
    <meta name="twitter:card" content="summary" />
    
    <!-- Typography is bundled locally in src/styles/fonts.css. -->

        --color-bg-initial: #FAF6EE;
        --color-text-initial: #2C221E;
      }
      body {
        margin: 0;

        background-color: var(--color-bg-initial);
        color: var(--color-text-initial);
        font-family: 'Martel', 'Noto Serif Devanagari', serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
